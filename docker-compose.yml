#  ---------------------------------------------------------------------------------------
#  A orquestração dos quatro containers
#  ---------------------------------------------------------------------------------------
#
#  Este arquivo mora na **raiz** do repositório, e não dentro de `API/` ou de `Frontend/`,
#  porque ele é a única peça do deploy que só existe porque os dois lados moram juntos: ele
#  descreve a relação entre eles — quem resolve o nome de quem, quem espera por quem, e quais
#  das portas chegam a existir fora da rede do compose (duas no IP público, as do `proxy`; uma
#  só na loopback do host, a do `db`; e nenhuma do `api` e do `web`).
#
#  **Subir e migrar são duas ações.** Não há `entrypoint` que rode a migration no boot: com o
#  `restart: unless-stopped` abaixo, uma migration que falha viraria um container em laço de
#  reinício tentando migrar um banco quebrado várias vezes por minuto, e o `rollback` deixaria
#  de ser uma decisão humana. A migration é um comando explícito do deploy
#  (`docker compose exec api npm run migrate:prod`), porque falha de um jeito diferente de
#  "o processo não sobe".

services:

  #  -----------------------------------------------------------------------------------
  #  db — o Postgres, e o volume que é o produto
  #  -----------------------------------------------------------------------------------
  #
  #  **Volume nomeado, nunca anônimo.** É a diferença entre um `docker compose down` que é
  #  rotina e um `docker compose down` que apaga o produto: o volume nomeado sobrevive ao
  #  `down`, ao `up` seguinte e à troca da imagem, e só morre quando alguém digita `-v`.
  #
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    #  -----------------------------------------------------------------------------------
    #  A porta, e o prefixo que é o assunto inteiro desta linha
    #  -----------------------------------------------------------------------------------
    #
    #  **`127.0.0.1:` não é detalhe de formatação — é a diferença entre uma porta na loopback
    #  da VPS e um Postgres na internet.** Escrito `"5432:5432"`, o Docker publica em **todas**
    #  as interfaces, inclusive o IP público, e o `ufw` não impede: o daemon escreve as próprias
    #  regras no `iptables` **antes** das dele, então `ufw status` continua jurando que a porta
    #  está fechada enquanto ela responde ao mundo. Um Postgres exposto é encontrado por scanner
    #  em horas, e o banco é a única coisa aqui que não se recria a partir deste repositório.
    #
    #  O mesmo cuidado, pela mesma razão, está no `web` (que hoje não publica nada) e no
    #  `proxy` (que publica de propósito, porque *é* a porta de entrada).
    #
    #  **Ela existe para o túnel SSH**, e só para ele: `db` continua sem ser alcançável de fora
    #  da máquina. Quem abre um cliente gráfico no banco de produção — o DBeaver — faz SSH até a
    #  VPS e encontra o Postgres em `127.0.0.1:5432` do outro lado do túnel. O procedimento, com
    #  o usuário só-leitura que ele deve usar, está no `1. Docs/Deploy.md`.
    #
    #  **Isto não aposenta o `docker compose exec db psql`.** Ele continua sendo o caminho do
    #  incidente, porque não depende de mais nada estar de pé — e é o que está escrito no
    #  runbook, que é lido com o app fora do ar.
    ports:
      - "127.0.0.1:5432:5432"

    #  **Volume nomeado, nunca anônimo.** É a diferença entre um `docker compose down` que é
    #  rotina e um `docker compose down` que apaga o produto: o volume nomeado sobrevive ao
    #  `down`, ao `up` seguinte e à troca da imagem, e só morre quando alguém digita `-v`.
    volumes:
      - pgdata:/var/lib/postgresql/data

    #  **As credenciais do banco são as mesmas três variáveis que a API lê**, e não um segundo
    #  par que alguém precisa lembrar de manter igual. `${DB_LOGIN}` e companhia são
    #  interpolados pelo compose a partir do `.env` da raiz — o arquivo que mora no servidor e
    #  que o `.gitignore` mantém fora do git —, de modo que o usuário que o `initdb` cria e o
    #  usuário com que o Knex se conecta não têm como divergir. A lista do que preencher é o
    #  `API/exemple.env`.
    #
    #  **O `:?` é deliberado**: sem a variável, o `docker compose up` para aqui com essa
    #  mensagem em vez de subir um Postgres sem senha.
    #
    #  E as três só valem no **primeiro** boot, quando o volume está vazio e o `initdb` roda.
    #  Num volume já inicializado elas são ignoradas em silêncio — trocar a senha depois é um
    #  `ALTER USER` dentro do banco, não uma edição aqui.
    #
    #  **O `env_file` da API não entra neste serviço**, de propósito: o container do Postgres
    #  não tem por que carregar o `JWT_SECRET` e a senha do SMTP no próprio ambiente.
    environment:
      POSTGRES_USER: ${DB_LOGIN:?defina DB_LOGIN no .env da raiz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
      POSTGRES_DB: ${DB_SCHEMA:?defina DB_SCHEMA no .env da raiz}

      #  **`TZ` no banco também, e não só na API.** O `now()` do Postgres e o carimbo de hora
      #  de cada linha do log dele saem no fuso do container: em UTC, o log do banco e o log da
      #  API contam a mesma falha com três horas de diferença, e quem faz a conta é o operador,
      #  às duas da manhã. O `initdb` do primeiro boot também lê o fuso do sistema para escrever
      #  o `timezone` do `postgresql.conf`, que é o que o `now()` devolve depois.
      #
      #  O que a variável decide no app, e a armadilha de ela ser ignorada em silêncio, estão
      #  na nota do `TZ` no serviço `api` abaixo.
      TZ: America/Sao_Paulo

    #  O healthcheck do banco é o que o `depends_on` da API espera, e é ele — não o da API —
    #  que responde por "o Postgres aceita conexão". `pg_isready` é o cliente oficial para
    #  essa pergunta e já vem na imagem.
    #
    #  O `$$` é escape do próprio compose: ele deixa o `$` chegar literal ao shell de dentro
    #  do container, onde `POSTGRES_USER` e `POSTGRES_DB` existem.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    #  Ver a nota sobre rotação de log no fim deste arquivo.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  #  -----------------------------------------------------------------------------------
  #  api — construída deste repositório, e invisível de fora
  #  -----------------------------------------------------------------------------------
  #
  #  **Sem `ports` também.** Quem fala com a API é o `web`, pela rede interna do compose, em
  #  `http://api:4000` — é o que o `proxy_pass` de `Frontend/deploy/nginx.conf` faz. Publicar
  #  a 4000 no host seria abrir uma segunda porta de entrada que não passa pelo nginx do
  #  container, e portanto sem a CSP, sem o cache e sem o `/api` da mesma origem que o cookie
  #  `SameSite=Strict` exige.
  api:
    build: ./API
    restart: unless-stopped

    #  **Em produção não existe arquivo `.env` dentro da imagem**, e é daqui que as variáveis
    #  vêm. A `.dockerignore` da etapa 1 mantém o `.env` fora da camada de propósito
    #  (credencial numa camada é credencial publicada no dia em que a imagem for), e o arquivo
    #  apontado abaixo mora no servidor, ao lado deste `docker-compose.yml`, sem ser versionado
    #  (`/.env` no `.gitignore` da raiz).
    #
    #  **Isso funciona sem tocar no carregamento atual porque `Utils.configEnv()` chama o
    #  `dotenv` sem `override`**: variável já presente no `process.env` vence o arquivo, e um
    #  arquivo ausente simplesmente não é lido — o `dotenv` não é um erro de boot, é um `no-op`.
    #  O `.env` continua sendo o caminho de desenvolvimento e, aqui dentro, não faz nada. Isso é
    #  o comportamento correto, não uma coincidência feliz.
    #
    #  A lista completa do que preencher é o `API/exemple.env`.
    env_file:
      - .env

    #  As duas variáveis que **não** saem do `.env`, porque são do ambiente e não do operador.
    #  Declaradas aqui elas vencem qualquer valor que o `env_file` acima traga, que é a ordem
    #  certa: o arquivo descreve a instalação, o compose descreve o ambiente.
    environment:
      #  **`NODE_ENV=production` é o que liga o comportamento de produção do código da leva 7**:
      #  o `secure` do cookie de sessão (sem ela o cookie sai sem `Secure` mesmo em https), o
      #  log no stdout em vez de arquivo, o SMTP real no lugar do `jsonTransport` e o stack de
      #  erro fora do stdout do container. Ela não pode vir do `.env`: o `dotenv` só é lido
      #  *depois* de alguém já ter perguntado qual é o ambiente, para decidir se o `.env.test`
      #  entra por cima. É também o que faz o `migrate:prod` achar a chave `production` do
      #  `knexfile`.
      NODE_ENV: production

      #  **`TZ` é a variável que ninguém tinha escrito**, e errá-la não dá erro — dá um número
      #  errado na tela. `Utils.currentMonth()` lê o mês corrente do relógio do processo, e esse
      #  mês é o valor padrão de três rotas: o saldo das contas (`GET /Accounts`), o relatório
      #  do mês e o extrato. Num container em UTC — o padrão de toda imagem Docker — das 21h às
      #  23h59 do último dia do mês, no horário de Brasília, as três respondem sobre o **mês
      #  seguinte**: o usuário abre o app às dez da noite do dia 31 e vê o saldo de um mês que
      #  ainda não começou, com o extrato vazio. Nada dá erro e nada vai para o log.
      #
      #  (As rotinas mensais, em `day: 1, hour: 3`, sobrevivem a UTC por acidente — três da
      #  manhã em UTC ainda é dia 1º no Brasil. Depender disso é depender de o horário do
      #  agendamento nunca mudar.)
      #
      #  **Ela depende do `tzdata` instalado na imagem** (`API/Dockerfile` o instala por causa
      #  disto): sem o pacote, a libc não acha o arquivo do fuso e **ignora o valor em
      #  silêncio**, deixando o processo em UTC com a variável ali, aparentemente certa. A prova
      #  é um comando, não uma leitura — `docker compose exec api date` tem de dizer `-03`.
      TZ: America/Sao_Paulo

    #  `service_healthy`, e não o `service_started` padrão: o container do Postgres existe
    #  segundos antes de o processo aceitar conexão, e nesse intervalo o pool do Knex subiria
    #  contra um banco que ainda não responde.
    depends_on:
      db:
        condition: service_healthy

    #  **20s, e o número é a correção de uma colisão.** O encerramento ordenado da API tem um
    #  teto interno de 10s antes de se matar à força, e o `docker stop` manda `SIGKILL` 10s
    #  depois do `SIGTERM`. Com os dois iguais, o `SIGKILL` chegaria no mesmo instante em que
    #  o processo desistiria sozinho, e a mensagem que torna esse caso diagnosticável
    #  ("Encerramento não terminou em 10s") nunca chegaria ao log. Com a janela do orquestrador
    #  maior que o teto interno, o processo sempre decide o próprio fim.
    stop_grace_period: 20s

    #  **`node -e` com o `fetch` global do Node 22**, e não `curl` ou `wget`: a imagem
    #  `bookworm-slim` não tem nenhum dos dois, e instalar um deles só para o healthcheck
    #  seria acrescentar superfície a uma imagem de produção por causa de uma linha de YAML.
    #
    #  **Ele prova que o processo escuta, não que o banco responde**, e isso é deliberado. A
    #  rota `/Utils/Health` é barata de propósito (`routes/Utils/Utils.controller.ts`), e quem
    #  prova o banco é o healthcheck do `db` acima. Um healthcheck que consultasse o Postgres
    #  faria a API ser reiniciada por causa de uma indisponibilidade do banco — reinício que
    #  não conserta nada e que ainda descarta as requisições em voo.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/Utils/Health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  #  -----------------------------------------------------------------------------------
  #  web — o nginx do produto, e agora sem porta nenhuma
  #  -----------------------------------------------------------------------------------
  #
  #  **`ports` saiu daqui na migração para a VPS, e a ausência é a mudança.** Enquanto o TLS
  #  terminava num nginx instalado no host, este serviço precisava de uma porta publicada
  #  (`127.0.0.1:8080:80`) para aquele nginx alcançá-lo — presa ao loopback justamente porque
  #  `"8080:80"` escuta em todas as interfaces e **fura o firewall do host**: o Docker escreve
  #  as próprias regras no `iptables` antes das do `ufw`, e a porta ficaria aberta no IP
  #  público com o firewall dizendo que está fechada.
  #
  #  Agora quem termina o TLS é o serviço `proxy`, **dentro da mesma rede do compose**, e ele
  #  alcança este container pelo nome `web` na porta 80 — sem publicar nada no host. Uma porta
  #  a menos na máquina é uma porta a menos para errar.
  web:
    build: ./Frontend
    restart: unless-stopped

    #  **Sem este `depends_on` o `web` não sobe**, e o modo de falhar não é óbvio: o
    #  `proxy_pass http://api:4000/` do `Frontend/deploy/nginx.conf` usa um nome literal, e o
    #  nginx resolve nome literal **na leitura da configuração**, não na requisição. Se `api`
    #  ainda não existe na rede do compose, o processo morre no parse com
    #  `[emerg] host not found in upstream "api"` — não é um 502 no primeiro acesso, é o
    #  container do front que nunca chega a escutar.
    #
    #  `service_started` basta: o que o DNS interno do Docker precisa é que o container `api`
    #  exista, não que ele esteja saudável. Esperar por `service_healthy` aqui atrasaria o
    #  front por causa do banco, e deixaria o site fora do ar num incidente em que ele ainda
    #  poderia servir a página e mostrar o erro da API na tela.
    depends_on:
      api:
        condition: service_started

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  #  -----------------------------------------------------------------------------------
  #  proxy — a borda, e o único serviço que o mundo alcança
  #  -----------------------------------------------------------------------------------
  #
  #  **Este serviço substitui o nginx do host.** Até a VPS, quem terminava o TLS era um nginx
  #  instalado na máquina e configurado à mão — o único pedaço do deploy que o `git` não via.
  #  Ele existia porque a máquina antiga era compartilhada com outros serviços e trocá-lo de
  #  lugar seria derrubar todos eles. Numa VPS que só hospeda este projeto esse motivo sumiu,
  #  e com ele a desvantagem: a configuração de produção volta para dentro do repositório, em
  #  `deploy/proxy/nginx.conf`.
  proxy:
    build: ./deploy/proxy
    restart: unless-stopped

    #  **Aqui o bind em todas as interfaces é o certo, e é a inversão da regra que vale para
    #  todos os outros serviços deste arquivo.** `api` e `web` não publicam porta nenhuma, e o
    #  `db` publica presa à loopback; este publica duas no IP público, porque ele *é* a porta de
    #  entrada. Não há `127.0.0.1:` na frente porque quem precisa alcançá-lo é a Cloudflare, de
    #  fora — e é a única linha deste arquivo de que isso é verdade.
    #
    #  **E é por isso que o `ufw` não é o que protege esta máquina.** O Docker escreve as
    #  próprias regras no `iptables` antes das do `ufw`: uma porta publicada aqui fica aberta
    #  no IP público mesmo com o `ufw` jurando que está fechada. O que fecha o resto é não
    #  publicar — e o que restringe estas duas a quem vem da Cloudflare, se um dia for
    #  preciso, é a cadeia `DOCKER-USER`, não o `ufw`. O runbook
    #  (`1. Docs/Começando do zero.md`) traz as regras.
    ports:
      - "80:80"
      - "443:443"

    #  **O certificado não entra na imagem, entra por volume, e `:ro`.** Ele é o único segredo
    #  desta configuração, e um segredo numa camada é um segredo publicado no dia em que a
    #  imagem for. O par é o de origem da Cloudflare, com validade de 15 anos — é o que
    #  dispensa certbot, volume de ACME e `deploy-hook` de recarga a cada 60 dias.
    #
    #  O diretório é criado à mão no servidor, com a chave em modo 600 e dono `root`. O nginx
    #  de dentro do container roda o processo mestre como `root` (é o padrão da imagem oficial,
    #  e é o que permite escutar nas portas 80 e 443), então ele lê a chave; os *workers*, que
    #  atendem a requisição, caem para o usuário `nginx` depois de o arquivo já estar na
    #  memória.
    volumes:
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro

    #  **Sem este `depends_on` o `proxy` não sobe**, pelo mesmo motivo que o `web` depende do
    #  `api`: o `proxy_pass http://web:80` de `deploy/proxy/nginx.conf` usa um nome literal, e
    #  o nginx resolve nome literal **na leitura da configuração**, não na requisição. Se `web`
    #  ainda não existe na rede do compose, o processo morre no parse com
    #  `[emerg] host not found in upstream "web"`.
    depends_on:
      web:
        condition: service_started

    #  O `healthz` mora no `default_server` da porta 80 de `deploy/proxy/nginx.conf`, e a razão
    #  está lá: com `Host: 127.0.0.1` a requisição não casa com o `server_name` do app e cai no
    #  bloco padrão, que responde 200 sem tocar no `web` nem na API.
    #
    #  **Ele prova que este nginx está de pé, e só isso, de propósito.** Um healthcheck que
    #  atravessasse a cadeia até a API marcaria a borda como doente por causa de uma queda do
    #  banco — e uma borda saudável com a API fora é exatamente o estado em que o usuário
    #  precisa receber o erro da API na tela, em vez de uma conexão recusada.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

#  ---------------------------------------------------------------------------------------
#  O volume, e a rotação de log dos quatro serviços
#  ---------------------------------------------------------------------------------------
#
#  **`pgdata` é o produto.** Declarado aqui como volume nomeado do projeto, ele é a única
#  coisa neste arquivo que não pode ser recriada a partir do repositório.
#
#  **A rotação de log repetida nos quatro serviços não é cerimônia.** A leva 7 tirou o log do
#  disco da aplicação e o mandou para o stdout — o que move o problema para o disco do daemon,
#  onde, no padrão do Docker, o `json-file` **cresce para sempre**. Num servidor pessoal, com
#  um disco só, o disco cheio derruba o Postgres junto com o resto. Não há como declarar isso
#  uma vez no compose: `logging` é por serviço, e o padrão do daemon vive em
#  `/etc/docker/daemon.json`, que é do host e não é versionado aqui.
volumes:
  pgdata:
