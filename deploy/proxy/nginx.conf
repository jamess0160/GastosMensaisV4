#  ---------------------------------------------------------------------------------------
#  O nginx de borda — TLS, IP real e o encaminhamento para o `web`
#  ---------------------------------------------------------------------------------------
#
#  Este arquivo é copiado para dentro da imagem pelo `deploy/proxy/Dockerfile` e é a
#  **configuração real**, não um exemplo: até a migração para a VPS existia um
#  `deploy/nginx/host.conf.example` que era uma cópia à mão do que estava em `/etc/nginx` do
#  servidor, e um `diff` entre os dois era a única coisa capaz de denunciar uma edição feita só
#  de um lado. Esse arquivo morreu na conteinerização — agora não há dois lados.
#
#  São **duas** camadas de nginx, esta e a de dentro do `web`, e a divisão não é acidental:
#
#  - **aqui fica o que é da máquina** — o certificado, o domínio, as faixas da Cloudflare e a
#    normalização do `X-Forwarded-For`. É o que muda quando o servidor muda;
#  - **no `web` fica o que é do produto** — o fallback do SPA, a CSP, o cache, o gzip e o
#    roteamento de `/api`. É o que muda quando o app muda, e é idêntico em qualquer máquina.
#
#  Colapsar as duas num nginx só é possível e custaria pouca memória, mas misturaria o
#  certificado com a CSP no mesmo arquivo e faria todo deploy do front reiniciar o processo que
#  termina o TLS. Com a divisão, `docker compose up -d web` troca o app sem que a borda caia.
#
#  ---------------------------------------------------------------------------------------
#  A cadeia de proxies, que é o assunto inteiro deste arquivo
#  ---------------------------------------------------------------------------------------
#
#      usuário → Cloudflare → este nginx → nginx do container `web` → api
#
#  São três saltos, e `API/Utils/server.ts` declara `trust proxy` igual a **um**. Os dois
#  números estão certos ao mesmo tempo, e é este arquivo que faz a conta fechar:
#
#  1. `real_ip_header CF-Connecting-IP` + `set_real_ip_from` fazem o salto da Cloudflare
#     **desaparecer**: o `$remote_addr` deste nginx deixa de ser o IP do datacenter da
#     Cloudflare e passa a ser o IP do usuário;
#  2. `proxy_set_header X-Forwarded-For $remote_addr` **sobrescreve** o cabeçalho em vez de
#     acrescentar a ele. É a linha que descarta qualquer `X-Forwarded-For` que tenha vindo de
#     fora e recomeça a cadeia a partir de um valor que o servidor apurou.
#
#  O nginx do container `web` **repassa** esse cabeçalho como está
#  (`Frontend/deploy/nginx.conf`), em vez de acrescentar o próprio salto a ele, então a API
#  recebe um elemento só:
#
#      X-Forwarded-For: <IP do usuário>
#
#  e o `trust proxy` igual a 1 — que conta **saltos a partir do socket**, e não elementos do
#  cabeçalho — confia no par da conexão (o container `web`) e fica com esse valor. **Um salto é
#  o que a API enxerga porque este arquivo normalizou tudo que vinha antes.**
#
#  **Errar essa conta não dá erro, dá um número.** Curto demais, o Express pega o IP do proxy
#  anterior: como todo request chega pelos mesmos poucos IPs da Cloudflare, o rate limiting de
#  `API/routes/Users/sections/RateLimits.section.ts` passa a contar o mundo inteiro como uma
#  pessoa só — cinco recuperações de senha por hora **no total**, e o sexto usuário do dia é
#  bloqueado por causa dos outros cinco. Longo demais, o Express aceita como verdadeiro um
#  `X-Forwarded-For` escrito pelo próprio cliente, e o freio passa a ser contornável trocando um
#  cabeçalho a cada tentativa.

#  ---------------------------------------------------------------------------------------
#  As faixas da Cloudflare
#  ---------------------------------------------------------------------------------------
#
#  Fonte: https://www.cloudflare.com/ips-v4 e https://www.cloudflare.com/ips-v6
#  Consultadas em **11/09/2026**.
#
#  A procedência e a data estão escritas porque **as listas mudam** — a Cloudflare acrescenta
#  faixas — e uma lista desatualizada **não dá erro**: o `set_real_ip_from` simplesmente deixa
#  de casar, o `$remote_addr` volta a ser o do datacenter, e todo usuário que entrar por uma
#  faixa nova vira um IP só para o rate limiting. Reconferir junto com a atualização do
#  servidor. O que não dá é confiar numa lista sem data.
#
#  `set_real_ip_from` é a **allowlist**: só uma conexão vinda de uma destas faixas tem o seu
#  `CF-Connecting-IP` acreditado. Um cliente que alcance o IP da VPS direto e mande o cabeçalho
#  não casa com nenhuma faixa e é ignorado — que é exatamente o que impede este mecanismo de
#  virar a porta dos fundos que ele fecha.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

#  **`CF-Connecting-IP`, e não `X-Forwarded-For`.** A Cloudflare escreve os dois, mas o
#  `X-Forwarded-For` dela é uma *lista* que começa com o que o cliente mandou — e ler uma lista
#  escrita em parte pelo cliente é de onde vem metade dos erros de IP real. O `CF-Connecting-IP`
#  é um valor só, apurado pela borda, e não tem como ser estendido por quem chama.
#
#  Por ser um valor único, o `real_ip_recursive` não tem o que fazer aqui e fica no padrão
#  (`off`): ele só existe para andar da direita para a esquerda dentro de uma lista.
real_ip_header CF-Connecting-IP;

#  ---------------------------------------------------------------------------------------
#  Os dois `default_server` — o que responde a quem chega pelo IP nu
#  ---------------------------------------------------------------------------------------
#
#  **Numa VPS com IP público isto deixou de ser detalhe.** Na máquina antiga o nginx do host já
#  tinha outros `server_name` e um deles acabava sendo o default; aqui este container é o único
#  que escuta nas portas 80 e 443, e **sem um `default_server` explícito o primeiro bloco do
#  arquivo assume o papel** — ou seja, o app responderia para qualquer `Host`, inclusive o IP
#  nu e qualquer domínio que alguém aponte para cá.
#
#  `444` é o código não-padrão do nginx que fecha a conexão **sem resposta nenhuma**. Para um
#  scanner isso é mais barato do que servir uma página de erro, e não confirma que existe um
#  site aqui.
#
#  O `/healthz` na porta 80 é a exceção, e existe para o `healthcheck` do `docker-compose.yml`:
#  ele bate em `http://127.0.0.1/healthz`, com `Host: 127.0.0.1`, que não casa com o
#  `server_name` do app e cai justamente aqui. É deliberado que a verificação prove **este**
#  nginx e não a cadeia inteira: um `healthz` que atravessasse até a API marcaria o proxy como
#  doente por causa de uma indisponibilidade do banco.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

#  Na 443 o `default_server` precisa de um certificado para chegar a completar o handshake e
#  poder fechar a conexão — é o mesmo par do app, e não há problema em reusá-lo: quem chega
#  aqui já vai receber erro de certificado de qualquer forma, porque pediu pelo IP.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/gastosmensais.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/gastosmensais.com.br.key;

    return 444;
}

#  ---------------------------------------------------------------------------------------
#  :80 — o redirecionamento
#  ---------------------------------------------------------------------------------------
#
#  Com a Cloudflare em **Full (strict)** e *Always Use HTTPS* ligado, a borda fala `https` com a
#  origem e este bloco quase nunca é usado: quem bate aqui é um scanner que descobriu o IP de
#  origem, ou o próprio usuário num link `http://` antigo que escapou da borda. Redirecionar é
#  mais barato do que servir o app em claro, e é o que impede um `X-Forwarded-Proto: http` de
#  chegar à API por uma porta lateral — com ele o `req.secure` é falso e o HSTS do helmet não
#  sai.
server {
    listen 80;
    listen [::]:80;

    server_name gastosmensais.com.br www.gastosmensais.com.br;

    return 301 https://$host$request_uri;
}

#  ---------------------------------------------------------------------------------------
#  :443 — o app
#  ---------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    #  **Os dois nomes, de propósito.** O `APP_URL` hoje é `https://www.gastosmensais.com.br`
    #  (é o domínio dos links que saem por e-mail) e o `WEBAUTHN_RP_ID` documentado é o apex
    #  `gastosmensais.com.br` — um RP ID no apex vale para ele e para os seus subdomínios, o
    #  contrário não. Travar este `server_name` em um dos dois faria o outro cair no
    #  `default_server` acima e receber um 444: quem digitasse o nome "errado" veria a conexão
    #  morrer sem explicação.
    #
    #  Aceitar os dois **não** decide qual é o canônico; essa decisão ainda não foi tomada, e
    #  quando for cabe num `server` a mais aqui, com um `return 301` para o escolhido, mais o
    #  ajuste de `APP_URL` e `WEBAUTHN_ORIGIN`. Enquanto isso, o `Host $host` abaixo repassa ao
    #  app exatamente o nome que o usuário pediu.
    server_name gastosmensais.com.br www.gastosmensais.com.br;

    #  **O certificado é o de origem da Cloudflare.** Ele **não** é confiável para um navegador,
    #  e não precisa ser: quem o valida é a Cloudflare, e o cadeado que o usuário vê é o dela.
    #  É ele que torna o modo **Full (strict)** possível — e Full (strict), nunca *Flexible*, é
    #  parte deste desenho. No modo *Flexible* a Cloudflare fala `http` com a origem: o tráfego
    #  entre ela e a VPS atravessa a internet em claro (inclusive o cookie de sessão e o corpo
    #  do login), o `X-Forwarded-Proto` chega como `http` e o HSTS nunca sai. **Nada disso
    #  aparece para quem olha o cadeado no navegador**, porque o cadeado é o da Cloudflare.
    #
    #  Os dois arquivos vêm de um volume `:ro` declarado no `docker-compose.yml`, e **não** da
    #  imagem: é a única parte desta configuração que é segredo, e segredo numa camada é
    #  segredo publicado no dia em que a imagem for. O certificado de origem vale **15 anos** e
    #  não tem renovação automática — é o que dispensa o certbot, o volume de ACME e o
    #  `deploy-hook` de recarregar o nginx a cada 60 dias.
    ssl_certificate     /etc/ssl/cloudflare/gastosmensais.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/gastosmensais.com.br.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    #  Tira a versão do nginx do cabeçalho `Server` e da página de erro. Não é segurança por si
    #  só; é não anunciar qual CVE procurar.
    server_tokens off;

    #  ---------------------------------------------------------------------------------
    #  O limite de corpo
    #  ---------------------------------------------------------------------------------
    #
    #  A API declara `express.json` com limite de 100kb e responde **413 com o `{ msg }` do
    #  app** quando o corpo passa disso. Este teto fica um pouco **acima** dele de propósito:
    #  abaixo, o nginx cortaria antes e o usuário receberia a página de erro HTML do nginx no
    #  lugar da resposta do app; acima, quem responde os casos reais é a API, e o nginx é só a
    #  barreira contra o corpo absurdo — que nem chega a ser bufferizado.
    #
    #  **A rota do `.xlsx` não é exceção aqui**: `GET /api/Reports/Export` é *saída*, não
    #  entrada, e o `client_max_body_size` só governa o corpo que sobe. O que ela precisa é de
    #  tempo, e isso está no `location` dela, no fim do arquivo.
    client_max_body_size 128k;

    #  ---------------------------------------------------------------------------------
    #  Os cabeçalhos que atravessam a cadeia
    #  ---------------------------------------------------------------------------------
    #
    #  Declarados no nível do `server` para valerem em todo `location` — com uma pegadinha do
    #  nginx que vale saber: `proxy_set_header` **não é somado, é substituído em bloco**. Um
    #  `location` que declare um único `proxy_set_header` deixa de herdar todos estes. É por
    #  isso que o `location` do `Export`, lá embaixo, não declara nenhum.
    #
    #  `X-Forwarded-For $remote_addr` — **sobrescrevendo, não acrescentando**, e é a linha mais
    #  importante deste arquivo. Com `$proxy_add_x_forwarded_for` no lugar dela, um cliente que
    #  mandasse `X-Forwarded-For: 1.2.3.4` faria a cadeia chegar à API com três elementos e o
    #  `trust proxy` igual a 1 descartaria só o último: o IP escolhido pelo cliente viraria o
    #  `req.ip`, e o rate limiting por IP deixaria de existir.
    proxy_set_header X-Forwarded-For $remote_addr;

    #  É deste cabeçalho que sai o `req.secure` do Express, e dele depende o HSTS que o helmet
    #  emite. Sem ele o Express acha que a conexão é `http` mesmo com o usuário em `https`, e o
    #  `Strict-Transport-Security` simplesmente não aparece na resposta — sem erro nenhum.
    proxy_set_header X-Forwarded-Proto $scheme;

    #  O nome que o usuário pediu, e não `web`. O app não constrói link a partir do `Host` (é
    #  para isso que existe o `APP_URL`), mas um `Host` errado é o que faz um redirect do nginx
    #  de dentro apontar para o nome interno do container, e é o que aparece no log.
    proxy_set_header Host $host;

    #  ---------------------------------------------------------------------------------
    #  `/` — tudo, inclusive `/api`, para um container só
    #  ---------------------------------------------------------------------------------
    #
    #  **Não há um `location /api` aqui, e a ausência é a decisão.** Quem separa o app da API é
    #  o nginx do container `web` (`Frontend/deploy/nginx.conf`); a borda encaminha o site
    #  inteiro para ele e não sabe que existe uma API. É o que faz a "mesma origem" que o cookie
    #  `SameSite=Strict` exige ser um fato de dentro do `compose`.
    #
    #  `web` é o nome do serviço na rede do compose, resolvido pelo DNS interno do Docker. O
    #  nome é literal de propósito — e a consequência é que **este nginx não sobe** se `web` não
    #  existir na rede, porque ele resolve o `proxy_pass` estático na leitura da configuração. É
    #  por isso que o `docker-compose.yml` declara `depends_on: web`, pelo mesmo motivo que o
    #  `web` declara `depends_on: api`.
    location / {
        proxy_pass http://web:80;
    }

    #  ---------------------------------------------------------------------------------
    #  `/api/Reports/Export` — a única rota que não responde JSON
    #  ---------------------------------------------------------------------------------
    #
    #  Ela monta um `.xlsx` com o `exceljs` e o escreve direto no `res`. Um período longo, num
    #  workspace com muito lançamento, passa dos **60 segundos** que o `proxy_read_timeout` usa
    #  por padrão — e o modo de falhar é o pior possível: o nginx desiste no meio, devolve
    #  **502**, e a API continua montando a planilha do outro lado. Para quem está na tela o
    #  relatório "deu erro"; para quem lê o log da API ele terminou bem.
    #
    #  **Nenhum `proxy_set_header` aqui, de propósito**: declarar um só faria este `location`
    #  perder os três do `server` acima (a diretiva é substituída em bloco, não somada) — e
    #  perder o `X-Forwarded-For` numa rota autenticada é perder o IP real justamente onde ele
    #  é lido.
    location = /api/Reports/Export {
        proxy_read_timeout 300s;
        proxy_pass http://web:80;
    }
}
