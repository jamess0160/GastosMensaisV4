#  ---------------------------------------------------------------------------------------
#  O nginx de dentro do container do front
#  ---------------------------------------------------------------------------------------
#
#  São duas camadas de nginx — esta e a do host — e isso parece redundante. Não é, e o motivo é
#  **onde a configuração mora**. O vhost do host vive em `/etc/nginx` do servidor, aplicado à
#  mão, e é o único pedaço do deploy que o `git` não vê; ele fica só com o que é do host: o
#  certificado, o nome do domínio e o encaminhamento para a porta local. Tudo que descreve o
#  **produto** — o fallback do SPA, a CSP, o cache, o gzip e o roteamento de `/api` — está
#  aqui, versionado, revisado em diff e idêntico em qualquer máquina.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    #  O `server_tokens` desligado tira a versão do nginx do cabeçalho `Server` e da página de
    #  erro. Não é segurança por si só; é não anunciar qual CVE procurar.
    server_tokens off;

    #  -----------------------------------------------------------------------------------
    #  A CSP
    #  -----------------------------------------------------------------------------------
    #
    #  A leva 7 desligou a `contentSecurityPolicy` do helmet na API de propósito: a API devolve
    #  JSON, e uma CSP ali protegeria um documento HTML que ela nunca entrega. A CSP que
    #  importa é a da **página**, e a página é servida daqui. Se este arquivo não a escrevesse,
    #  ninguém escreveria, e uma decisão consciente viraria um buraco por acidente.
    #
    #  `'unsafe-inline'` fica em `style-src` porque o React escreve atributos `style` e o
    #  echarts monta estilo em linha; tirá-lo é quebrar os gráficos. Em `script-src` ele
    #  **não** entra, e é esse o que vale — é o que transforma um XSS em um erro de console.
    #
    #  `frame-ancestors 'none'` impede o app de ser embutido no iframe de outro site, que é o
    #  vetor que sobra quando a sessão é um cookie que o navegador anexa sozinho.
    #
    #  `connect-src 'self'` é possível porque o cliente axios tem `baseURL: "/api"`, relativo —
    #  e passa a ser uma trava: uma chamada para um domínio de terceiro falha visivelmente em
    #  vez de funcionar em silêncio.
    #
    #  **`add_header` não é herdado por um `location` que tenha o seu próprio `add_header`** —
    #  a diretiva é substituída em bloco, não somada. É por isso que a CSP se repete nos dois
    #  `location` abaixo que definem `Cache-Control`: sem a repetição, o `index.html` (o único
    #  documento HTML que este servidor entrega) sairia justamente sem ela.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    #  -----------------------------------------------------------------------------------
    #  gzip
    #  -----------------------------------------------------------------------------------
    #
    #  O bundle do app é JS e CSS — texto, que comprime a um terço. `gzip_vary` é o que impede
    #  um proxy intermediário de servir a resposta comprimida a um cliente que não a pediu.
    #  Imagem e `.woff2` ficam de fora de propósito: já são formatos comprimidos, e gastar CPU
    #  para crescer o arquivo é o pior dos dois mundos.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    #  -----------------------------------------------------------------------------------
    #  /api — o proxy para a API, na rede interna do compose
    #  -----------------------------------------------------------------------------------
    #
    #  **A barra final do `proxy_pass` é o que faz esta linha funcionar**: com ela, o trecho
    #  casado pelo `location` é substituído, e `/api/Users/login` chega à API como
    #  `/Users/login` — exatamente o que o `rewrite` do proxy do Vite faz em desenvolvimento
    #  (`vite.config.ts`). Sem a barra, a API receberia `/api/Users/login` e responderia 404 em
    #  toda rota.
    #
    #  O container do front fazer este proxy é o que torna a "mesma origem" que o
    #  `SameSite=Strict` exige um fato de dentro do `compose`, e não uma propriedade que
    #  depende de o vhost do host estar certo: o host encaminha **tudo** para uma porta só.
    #
    #  `api` é o nome do serviço na rede do compose, resolvido pelo DNS interno do Docker. O
    #  nome é literal de propósito — e a consequência é que o nginx **não sobe** se `api` não
    #  existir na rede, porque ele resolve o `proxy_pass` estático na leitura da configuração.
    location /api/ {
        proxy_pass http://api:4000/;
    }

    #  -----------------------------------------------------------------------------------
    #  O cache, que são duas políticas opostas
    #  -----------------------------------------------------------------------------------
    #
    #  O Vite gera `assets/*.[hash].js`: o nome **é** a impressão digital do conteúdo, então o
    #  arquivo nunca muda — mudou o conteúdo, mudou o nome. `immutable` é o que faz o navegador
    #  nem revalidar, e um deploy novo simplesmente pede outros nomes.
    #
    #  Nada de `try_files` aqui: um asset que não existe tem de responder 404. Caindo no
    #  fallback do SPA, ele responderia `index.html` com `Content-Type: application/javascript`
    #  — um erro de sintaxe no console no lugar de um 404 legível.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    #  O `index.html` é o oposto: ele muda a cada build e é quem aponta para os assets.
    #  Guardado pelo navegador, ele serve o app antigo pedindo arquivos que o deploy acabou de
    #  apagar — uma tela em branco depois de todo deploy, para quem já tinha visitado o site.
    #  `no-cache` não é "não guarde": é "guarde, mas revalide sempre", que devolve 304 barato
    #  enquanto nada muda.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    #  -----------------------------------------------------------------------------------
    #  O fallback do SPA
    #  -----------------------------------------------------------------------------------
    #
    #  Todo caminho do app é resolvido no navegador pelo react-router (`src/app/routes.tsx`).
    #  Um servidor estático honesto responde 404 para `GET /privacidade`, porque não existe
    #  arquivo `privacidade` — e quem **atualiza a página** em qualquer tela que não a raiz, ou
    #  clica no link da política de privacidade, recebe a página de erro do nginx.
    #
    #  O último parâmetro do `try_files` é uma URI, e não um arquivo: ele provoca um redirect
    #  interno, que refaz a busca de `location` e cai no `= /index.html` acima — é assim que a
    #  resposta do fallback sai com o `Cache-Control` certo.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
