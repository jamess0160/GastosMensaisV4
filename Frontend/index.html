<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#FF6A00" />
        <meta
            name="description"
            content="Todo dinheiro do mês em um lugar só: gastos divididos entre destinos, parcelas acompanhadas e o mês fechado sem planilha."
        />

        <!-- Derivados de `public/logo.png`, que continua servindo de IMAGEM no app mas deixou
             de ser o ícone: 761 KB baixados em toda visita para desenhar 16 pixels na aba.
             Precisam EXISTIR em `public/` — com o `try_files` do nginx, um ícone que falta não
             dá 404, dá `index.html`.

             O `site.webmanifest` declara CADA tamanho DUAS vezes, e os dois pares não são
             redundância:

             - `purpose: "maskable"` (`icon-*-maskable.png`) é o ícone do LANÇADOR do Android.
               Sem um ícone marcado assim, o Android não confia que a arte sobrevive ao
               recorte da máscara do aparelho (círculo, quadrado arredondado, gota) e aplica o
               tratamento de ícone legado: encolhe a imagem inteira e a cola sobre um disco
               branco. É isso, e não um tamanho faltando, que faz a marca aparecer pequena
               dentro do ícone instalado. A máscara come até 10% de cada lado, então a arte
               desses dois arquivos tem a margem embutida — o `G` cabe no círculo de 80% do
               lado, que é a zona segura do formato;
             - `purpose: "any"` (`icon-192.png`, `icon-512.png`) continua cheio até a borda,
               porque ninguém o recorta: é ele que o Chrome usa na TELA DE CARREGAMENTO do app
               instalado, no diálogo de instalar e no atalho de desktop.

             O `apple-touch-icon` fica fora dessa conversa: o iOS não tem máscara adaptativa —
             ele arredonda os cantos da arte cheia, e por isso esse arquivo não leva margem.

             **O hexadecimal no nome é o começo do sha256 do próprio arquivo**, pela mesma razão
             que o Vite carimba hash nos `assets/`: o nome É a impressão digital, então trocar a
             arte troca a URL. Sem isso, a Cloudflare na frente do site guarda o ícone por quatro
             horas e serve a arte velha depois do deploy — medido, com `cf-cache-status: HIT` e
             o `Content-Length` do arquivo anterior, enquanto a origem já respondia o novo. O
             `site.webmanifest` escapa disso sozinho (a extensão não está na lista de tipos que
             a Cloudflare cacheia, e ele responde `DYNAMIC`), e é por isso que basta ele apontar
             para um nome novo: o manifesto chega na hora e pede a URL que ninguém tem em cache.

             **Trocar a arte é trocar o hash junto**, nos dois lugares que a citam (aqui e no
             manifesto) — o `sha256sum` de cada arquivo tem de bater com o nome dele. Esquecer
             não quebra nada em desenvolvimento e volta a ser exatamente o bug acima, em
             produção, horas depois.

             **O `favicon.ico` é a exceção, e ela é deliberada**: `/favicon.ico` é um caminho que
             o próprio navegador pede sozinho em alguns contextos, sem ler o `<link>`. Renomeado,
             esse pedido cairia no `try_files` do nginx e receberia o `index.html` com
             `Content-Type: image/x-icon`. Ele fica no nome fixo e paga o preço de uma purga
             manual na Cloudflare no dia em que mudar. -->
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.b3c3d14f.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <!-- Inter e JetBrains Mono NÃO se pedem ao Google aqui: elas moram em
             `src/assets/fonts/` e são declaradas em `src/styles/fonts.css`. O link que
             estava nesta linha entregava o IP de todo visitante antes da tela de login,
             e a CSP de `deploy/nginx.conf` diz `font-src 'self'`. -->
        <title>Gastos mensais</title>

        <!-- O TEMA, e ele vem antes do primeiro pixel.

             Clássico e sem `defer` de propósito: o parser para aqui, o script carimba o
             `data-theme` no `<html>` lendo o `localStorage`, e só então o corpo é
             desenhado. Feito no React, isso aconteceria depois do primeiro quadro — e
             quem escolheu escuro veria o app piscar branco em toda carga.

             Por que é um arquivo e não um `<script>` escrito aqui dentro: a CSP diz
             `script-src 'self'` sem `'unsafe-inline'`. Inline, ele funcionaria em
             desenvolvimento e seria bloqueado em produção. O porquê inteiro está em
             `public/theme.js`.

             Depois daqui, quem manda no tema é `src/app/theme.tsx`. -->
        <script src="/theme.js"></script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
